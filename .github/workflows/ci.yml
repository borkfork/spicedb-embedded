name: CI

env:
  MISE_HTTP_TIMEOUT: ${{ vars.MISE_HTTP_TIMEOUT }}

on:
  pull_request:
  merge_group:
  push:
    branches: [main, "release-please--**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      csharp: ${{ steps.filter.outputs.csharp }}
      node: ${{ steps.filter.outputs.node }}
      native: ${{ steps.filter.outputs.native }}
      format: ${{ steps.filter.outputs.format }}
      docs_rs: ${{ steps.filter.outputs['docs-rs'] }}
      renovate: ${{ steps.filter.outputs.renovate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: .github/ci-paths.yml

  # Build one canonical shared library artifact per platform for selected language tests.
  shared-c-lib:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
          - runner: macos-latest
            rid: osx-arm64
          - runner: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: "go"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: out
          key: shared-c-native-v2-${{ matrix.rid }}-${{ hashFiles('mise.toml', 'shared/c/go.mod', 'shared/c/go.sum', 'shared/c/**/*.go', 'shared/c/spicedb.def', 'scripts/shared-c-build.sh', 'scripts/lib-path.sh', 'scripts/generate-dll-import-lib.sh', 'scripts/stage-shared-lib.sh') }}

      - uses: jdx/mise-action@v3
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          install_args: "go"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set GOCACHE
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: echo "GOCACHE=$HOME/.cache/go-build" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: go-mod-cache
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mod-${{ hashFiles('shared/c/go.sum') }}

      - uses: actions/cache/restore@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        id: go-build-cache
        with:
          path: ~/.cache/go-build
          key: ${{ matrix.rid }}-go-build-${{ hashFiles('mise.toml', 'shared/c/go.mod', 'shared/c/go.sum', 'shared/c/**/*.go') }}

      - name: Build shared C library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: mise run shared-c-build

      - name: Stage canonical native artifact
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash ./scripts/stage-shared-lib.sh out

      - uses: actions/cache/save@v4
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: out
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - uses: actions/cache/save@v4
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          steps.go-mod-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}

      - uses: actions/cache/save@v4
        if: >-
          steps.native-cache.outputs.cache-hit != 'true' &&
          steps.go-build-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: shared-lib-${{ matrix.rid }}
          path: out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  docs-rs:
    needs: changes
    if: needs.changes.outputs.docs_rs == 'true'
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: "rust"
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: "rust"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install nightly toolchain
        run: rustup toolchain install nightly

      - name: Verify docs.rs build
        run: mise run rust-docsrs

  format-toml-shell:
    needs: changes
    if: needs.changes.outputs.format == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3
        with:
          install_args: "taplo shellcheck shfmt"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: TOML, shell, and Actions format check
        run: mise run toml-format-check && mise run bash-format-check && mise run actions-format-check

  renovate-config:
    needs: changes
    if: needs.changes.outputs.renovate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Renovate config
        run: npx --yes --package renovate -- renovate-config-validator

  rust:
    needs: [changes, shared-c-lib]
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            quality: true
            docker: true
            extra_tools: "github:authzed/spicedb github:EmbarkStudios/cargo-deny"
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            quality: false
            docker: true
            extra_tools: ""
          - runner: macos-latest
            rid: osx-arm64
            quality: false
            docker: false
            extra_tools: ""
          - runner: windows-latest
            rid: win-x64
            quality: false
            docker: false
            extra_tools: ""
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: "rust,buf,protoc${{ matrix.extra_tools != '' && format(',{0}', matrix.extra_tools) || '' }}"
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: matrix.docker && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.rid }}
          path: out

      - name: Stage Rust prebuild
        run: bash ./scripts/stage-downloaded-prebuild.sh rust out "${{ matrix.rid }}"

      - uses: jdx/mise-action@v3
        with:
          install_args: "rust buf protoc ${{ matrix.extra_tools }}"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Format check
        if: matrix.quality
        run: mise run rust-format-check

      - name: Clippy
        run: mise run rust-clippy

      - name: Cargo deny
        if: matrix.quality
        run: mise run rust-cargo-deny

      - name: Test
        run: cargo test -p spicedb-embedded --locked

      - name: Example tests
        run: mise run example-rust-test

  java:
    needs: [changes, shared-c-lib]
    if: needs.changes.outputs.java == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            quality: true
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            quality: false
          - runner: macos-latest
            rid: osx-arm64
            quality: false
          - runner: windows-latest
            rid: win-x64
            quality: false
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: "java,maven"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.rid }}
          path: out

      - name: Stage Java prebuild
        run: bash ./scripts/stage-downloaded-prebuild.sh java out "${{ matrix.rid }}"

      - uses: jdx/mise-action@v3
        with:
          install_args: "java maven"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/cache/restore@v4
        id: maven-cache
        with:
          path: ~/.m2/repository
          key: ${{ matrix.rid }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ matrix.rid }}-maven-

      - name: Set library path
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016
          eval "$(mise activate bash | sed 's|eval "$(mise hook-env -s bash)";|& export PATH="$(/usr/bin/cygpath -u -p "$PATH")";|')"

      - name: Format check
        if: matrix.quality
        run: mise run java-format-check

      - name: Test
        working-directory: java
        run: mvn test

      - uses: actions/cache/save@v4
        if: >-
          steps.maven-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

  python:
    needs: [changes, shared-c-lib]
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            quality: true
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            quality: false
          - runner: macos-latest
            rid: osx-arm64
            quality: false
          - runner: windows-latest
            rid: win-x64
            quality: false
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: "python"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.rid }}
          path: out

      - name: Stage Python prebuild
        run: bash ./scripts/stage-downloaded-prebuild.sh python out "${{ matrix.rid }}"

      - uses: jdx/mise-action@v3
        with:
          install_args: "python"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/cache/restore@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ matrix.rid }}-pip-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt') }}
          restore-keys: ${{ matrix.rid }}-pip-

      - name: Set library path
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016
          eval "$(mise activate bash | sed 's|eval "$(mise hook-env -s bash)";|& export PATH="$(/usr/bin/cygpath -u -p "$PATH")";|')"

      - name: Install package and test dependencies
        working-directory: python
        run: pip install -e '.[dev]'

      - name: Format check
        if: matrix.quality
        working-directory: python
        run: ruff format --check .

      - name: Test
        working-directory: python
        run: pytest

      - name: Install example project
        working-directory: examples/python/google-docs
        run: |
          pip install -e '.[dev]'
          pip install -e ../../../python

      - name: Example tests
        working-directory: examples/python/google-docs
        run: pytest tests/ -v

      - uses: actions/cache/save@v4
        if: >-
          steps.pip-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

  csharp:
    needs: [changes, shared-c-lib]
    if: needs.changes.outputs.csharp == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            quality: true
            extra_tools: "jq"
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            quality: false
            extra_tools: ""
          - runner: macos-latest
            rid: osx-arm64
            quality: false
            extra_tools: ""
          - runner: windows-latest
            rid: win-x64
            quality: false
            extra_tools: ""
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: "dotnet${{ matrix.extra_tools != '' && format(',{0}', matrix.extra_tools) || '' }}"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.rid }}
          path: out

      - name: Stage C# prebuild
        run: bash ./scripts/stage-downloaded-prebuild.sh csharp out "${{ matrix.rid }}"

      - uses: jdx/mise-action@v3
        with:
          install_args: "dotnet ${{ matrix.extra_tools }}"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/cache/restore@v4
        id: nuget-cache
        with:
          path: ~/.nuget/packages
          key: ${{ matrix.rid }}-nuget-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: ${{ matrix.rid }}-nuget-

      - name: Set library path
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016
          eval "$(mise activate bash | sed 's|eval "$(mise hook-env -s bash)";|& export PATH="$(/usr/bin/cygpath -u -p "$PATH")";|')"

      - name: Format and ReSharper check
        if: matrix.quality
        run: mise run csharp-resharper-check

      - name: Upload ReSharper report
        if: always() && matrix.quality
        uses: actions/upload-artifact@v4
        with:
          name: resharper-inspect
          path: csharp/resharper-inspect.sarif
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        run: |
          dotnet build csharp/SpiceDbEmbedded.sln
          dotnet test csharp/SpiceDbEmbedded.Tests/SpiceDbEmbedded.Tests.csproj --no-build

      - name: Example tests
        run: mise run example-csharp-test

      - uses: actions/cache/save@v4
        if: >-
          steps.nuget-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

  node:
    needs: [changes, shared-c-lib]
    if: needs.changes.outputs.node == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            quality: true
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            quality: false
          - runner: macos-latest
            rid: osx-arm64
            quality: false
          - runner: windows-latest
            rid: win-x64
            quality: false
    runs-on: ${{ matrix.runner }}
    env:
      MISE_ENABLE_TOOLS: "node"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.rid }}
          path: out

      - name: Stage Node prebuild
        run: bash ./scripts/stage-downloaded-prebuild.sh node out "${{ matrix.rid }}"

      - uses: jdx/mise-action@v3
        with:
          install_args: "node"
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ matrix.rid }}-npm-${{ hashFiles('node/package-lock.json', 'examples/node/google-docs/package-lock.json') }}
          restore-keys: ${{ matrix.rid }}-npm-

      - name: Set library path
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016
          eval "$(mise activate bash | sed 's|eval "$(mise hook-env -s bash)";|& export PATH="$(/usr/bin/cygpath -u -p "$PATH")";|')"

      - name: Install dependencies
        working-directory: node
        run: npm ci

      - name: Format check
        if: matrix.quality
        working-directory: node
        run: npm run format:check

      - name: Test
        working-directory: node
        run: |
          npm run build
          npm test

      - name: Example tests
        run: mise run example-node-test

      - uses: actions/cache/save@v4
        if: >-
          steps.npm-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [
        changes,
        shared-c-lib,
        docs-rs,
        format-toml-shell,
        renovate-config,
        rust,
        java,
        python,
        csharp,
        node,
      ]
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      NATIVE_SELECTED: ${{ needs.changes.outputs.native }}
      RUST_SELECTED: ${{ needs.changes.outputs.rust }}
      JAVA_SELECTED: ${{ needs.changes.outputs.java }}
      PYTHON_SELECTED: ${{ needs.changes.outputs.python }}
      CSHARP_SELECTED: ${{ needs.changes.outputs.csharp }}
      NODE_SELECTED: ${{ needs.changes.outputs.node }}
      DOCS_RS_SELECTED: ${{ needs.changes.outputs.docs_rs }}
      FORMAT_SELECTED: ${{ needs.changes.outputs.format }}
      RENOVATE_SELECTED: ${{ needs.changes.outputs.renovate }}
      SHARED_C_RESULT: ${{ needs.shared-c-lib.result }}
      RUST_RESULT: ${{ needs.rust.result }}
      JAVA_RESULT: ${{ needs.java.result }}
      PYTHON_RESULT: ${{ needs.python.result }}
      CSHARP_RESULT: ${{ needs.csharp.result }}
      NODE_RESULT: ${{ needs.node.result }}
      DOCS_RS_RESULT: ${{ needs.docs-rs.result }}
      FORMAT_RESULT: ${{ needs.format-toml-shell.result }}
      RENOVATE_RESULT: ${{ needs.renovate-config.result }}
    steps:
      - name: Verify selected jobs
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON" | jq -e '
            all(.[];
              .result == "success" or
              .result == "skipped"
            )
          '

          check_selected() {
            selected="$1"
            result="$2"
            job="$3"
            if [ "$selected" = "true" ] && [ "$result" != "success" ]; then
              echo "::error::$job was selected but finished with result: $result"
              exit 1
            fi
          }

          check_selected "$NATIVE_SELECTED" "$SHARED_C_RESULT" "shared-c-lib"
          check_selected "$RUST_SELECTED" "$RUST_RESULT" "rust"
          check_selected "$JAVA_SELECTED" "$JAVA_RESULT" "java"
          check_selected "$PYTHON_SELECTED" "$PYTHON_RESULT" "python"
          check_selected "$CSHARP_SELECTED" "$CSHARP_RESULT" "csharp"
          check_selected "$NODE_SELECTED" "$NODE_RESULT" "node"
          check_selected "$DOCS_RS_SELECTED" "$DOCS_RS_RESULT" "docs-rs"
          check_selected "$FORMAT_SELECTED" "$FORMAT_RESULT" "format-toml-shell"
          check_selected "$RENOVATE_SELECTED" "$RENOVATE_RESULT" "renovate-config"
