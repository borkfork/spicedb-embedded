# Update example version pins and lockfiles after a release is published.
# Examples depend on the published registry packages (npm, PyPI, NuGet, Maven),
# so lockfiles can only be resolved after publish completes. The Rust example is
# a workspace member whose pin release-please bumps, so it is not updated here.
#
# Triggered by: publish.yml dispatch after all registries are updated.

name: Update examples after publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version number (e.g. 0.5.2)"
        required: true
        type: string

permissions:
  actions: write # Dispatch CI on the PR branch
  contents: write
  pull-requests: write

concurrency:
  group: update-examples
  cancel-in-progress: false

env:
  MISE_HTTP_TIMEOUT: ${{ vars.MISE_HTTP_TIMEOUT }}

jobs:
  update-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MISE_ENABLE_TOOLS: "node"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: jdx/mise-action@v3
        with:
          install_args: "node"
          cache_save: false

      - name: Update example version pins
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Java pom.xml: update <version> on lines following <artifactId>spicedb-embedded</artifactId>
          sed -i '/<artifactId>spicedb-embedded<\/artifactId>/{n;s|<version>[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*</version>|<version>'"${VERSION}"'</version>|}' \
            examples/java/google-docs/pom.xml

          # C# csproj: update SpiceDbEmbedded PackageReference Version attribute
          sed -i 's|SpiceDbEmbedded" Version="[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"|SpiceDbEmbedded" Version="'"${VERSION}"'"|' \
            examples/csharp/google-docs/GoogleDocsExample.csproj

          # Node package.json: update spicedb-embedded dependency
          sed -i 's|"spicedb-embedded": "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"|"spicedb-embedded": "'"${VERSION}"'"|' \
            examples/node/google-docs/package.json

          # Python pyproject.toml: update spicedb-embedded minimum version
          sed -i 's|"spicedb-embedded>=[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*"|"spicedb-embedded>='"${VERSION}"'"|' \
            examples/python/google-docs/pyproject.toml

          # Every pin must now name the release; a pattern that stopped matching fails here.
          grep -q "<version>${VERSION}</version>" examples/java/google-docs/pom.xml
          grep -q "SpiceDbEmbedded\" Version=\"${VERSION}\"" examples/csharp/google-docs/GoogleDocsExample.csproj
          grep -q "\"spicedb-embedded\": \"${VERSION}\"" examples/node/google-docs/package.json
          grep -q "\"spicedb-embedded>=${VERSION}\"" examples/python/google-docs/pyproject.toml
          grep -q "version = \"${VERSION}\".*x-release-please-version" examples/rust/google-docs/Cargo.toml

      - name: Update Node lockfiles
        run: |
          npm install --prefix node
          npm install --prefix examples/node/google-docs

      - name: Create pull request
        id: pr
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes needed" && exit 0
          BRANCH="chore/update-examples-v${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "chore: update examples to v${VERSION}"
          git push -u origin "$BRANCH"
          BODY="Auto-generated after v${VERSION} was published to package registries."
          BODY="${BODY}"$'\n\n'"Updates example dependency version pins and lockfiles to reference the newly published packages."
          PR_URL=$(gh pr create \
            --title "chore: update examples to v${VERSION}" \
            --body "$BODY")
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      # The push above used GITHUB_TOKEN, which starts no workflows, so the PR has
      # no ci-gate check. A dispatched run reports its checks on the same commit.
      - name: Run CI on the PR branch
        if: steps.pr.outputs.branch != ''
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          gh workflow run ci.yml --ref "$BRANCH"
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --commit "$SHA" \
              --json databaseId -q '.[0].databaseId // empty')
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          [ -n "$RUN_ID" ] || { echo "::error::CI run for $BRANCH did not start"; exit 1; }
          gh run watch "$RUN_ID" --exit-status --interval 60

      # Auto-merge is off and main merges through a merge queue, so the PR is
      # enqueued once ci-gate has passed.
      - name: Add the PR to the merge queue
        if: steps.pr.outputs.url != ''
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_ID=$(gh pr view "$PR_URL" --json id -q .id)
          QUERY="mutation(\$id: ID!) { enqueuePullRequest(input: {pullRequestId: \$id}) { mergeQueueEntry { state } } }"
          gh api graphql -f query="$QUERY" -f id="$PR_ID"
